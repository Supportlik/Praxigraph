[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxigraph"
dynamic = ["version"]
description = "Markdown-driven business document generator on your own letterhead: reports, minutes and certificates as PDF via Chrome headless"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Bortlik", email = "michael@bortlik.io" }]
keywords = ["report", "minutes", "protocol", "letterhead", "pdf", "markdown", "generator"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
  "Topic :: Printing",
  "Topic :: Text Processing :: Markup :: HTML",
]
# All three dependencies are pure Python: PyYAML for config and front matter,
# Markdown for the document bodies, pypdf for page numbers and metadata.
dependencies = ["PyYAML>=6.0", "Markdown>=3.5", "pypdf>=6.0"]

[project.scripts]
praxigraph = "praxigraph.cli:main"

[project.urls]
Homepage = "https://github.com/Supportlik/Praxigraph"
Repository = "https://github.com/Supportlik/Praxigraph"
Issues = "https://github.com/Supportlik/Praxigraph/issues"
Changelog = "https://github.com/Supportlik/Praxigraph/blob/main/CHANGELOG.md"
Specification = "https://github.com/Supportlik/Praxigraph/blob/main/docs/SPEC.md"

[dependency-groups]
dev = ["pytest>=8"]

# The version lives in src/praxigraph/__init__.py only, so the CLI's --version
# output and the package metadata can never drift apart.
[tool.hatch.version]
path = "src/praxigraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/praxigraph"]

# The rendered example PDFs are committed for repo visitors but are dead weight
# in an sdist. The example YAML/Markdown files stay in: they double as fixtures.
[tool.hatch.build.targets.sdist]
exclude = ["examples/*/pdf", "examples/*/.build", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
